<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristen Rose - Carte de Visite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="card">
        <!-- Header avec background -->
        <div class="header-background">
            <img src="bg.jpg" alt="Background">
        </div>
        
        <!-- Photo de profil -->
        <div class="profile-photo">
            <img src="profile.jpg" alt="Kristen Rose">
        </div>
        
        <!-- Informations -->
        <div class="info-section">
            <h1 class="name">Shakurov Matin</h1>
            <p class="title">Photographe</p>
            <p class="company">Evenmentiel | Profesionnel | Couple | Portrait</p>
            
            <!-- Code QR -->
            <div class="qr-code">
                <img src="qr-code.png" alt="QR Code">
            </div>
            
            <!-- Contact -->
            <div class="contact-list">
                <div class="contact-item">
                    <i class="fa-regular fa-envelope"></i>
                    <span>matinshakurov@gmail.com</span>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>+33 679 11 04 24</span>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-globe"></i>
                    <span>matinshakurov.com</span>
                </div>
                <div class="contact-item">
                    <i class="fa-brands fa-instagram"></i>
                    <span>@shakurov_photos</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
